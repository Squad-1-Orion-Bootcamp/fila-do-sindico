server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: qualquer rota desconhecida (ex.: /quadro) devolve o index.html
  # para o React Router decidir o que mostrar.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Arquivos com hash no nome podem ficar em cache por muito tempo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
